name: Release

# Pushing a tag `vX.Y.Z` builds the signed release APK and creates a DRAFT GitHub release with it. The draft is published by
# hand after the APK has been tried on a phone. See "Releases" in README.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the app version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check that the changelog describes this version
        run: grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      # The key comes from repository secrets and is written outside the checkout; build.gradle.kts finds it through
      # FLIRONE_KEYSTORE_PROPERTIES.
      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The signing secrets are not set (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/keystore.properties"
          echo "FLIRONE_KEYSTORE_PROPERTIES=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"

      - name: Check, test and build the release
        run: ./gradlew spotlessCheck detekt lintRelease testDebugUnitTest :protocol:test :radiometry:test assembleRelease --console=plain

      - name: Verify the signature and collect the files
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          apk=app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs "$apk"
          mkdir dist
          cp "$apk" "dist/FLIRONEPro-$TAG.apk"
          (cd dist && sha256sum "FLIRONEPro-$TAG.apk" > "FLIRONEPro-$TAG.apk.sha256")
          # The R8 mapping turns the obfuscated stack traces of this version back into readable ones.
          (cd app/build/outputs/mapping/release && zip -q "$GITHUB_WORKSPACE/dist/FLIRONEPro-$TAG-mapping.zip" mapping.txt)
          ls -l dist

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are the changelog section of this version plus the standard install text.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && (index($0, "## [") == 1 || index($0, "[") == 1) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          sha=$(cut -d" " -f1 "dist/FLIRONEPro-$TAG.apk.sha256")
          {
            echo
            echo "## Install"
            echo
            echo "Download \`FLIRONEPro-$TAG.apk\`, open it on an Android 10+ phone and allow the installation from this source."
            echo "Plug the camera into the USB-C port afterwards. See the [README](https://github.com/${GITHUB_REPOSITORY}#install)."
            echo
            echo "SHA-256: \`$sha\`"
            echo
            echo "*Unofficial project, not affiliated with Teledyne FLIR. Not a certified measuring instrument.*"
          } >> notes.md
          gh release create "$TAG" dist/* --draft --verify-tag --title "FLIR ONE Pro $VERSION" --notes-file notes.md
