# Project overrides; everything else comes from detekt's default configuration (buildUponDefaultConfig = true).

style:
  MaxLineLength:
    maxLineLength: 140
    excludeCommentStatements: true
  MagicNumber:
    excludes:
      - '**/test/**'
      - '**/testFixtures/**'
      - '**/androidTest/**'
      # Canvas drawing and palette tables: coordinates, fractions of the canvas, colors. There the numbers are the content
      # itself, and a constant like PADDING_TOP = 12 would only hide them. (Screen layout is not here: sizes and colors of the
      # views live in res/layout, res/values and res/color.)
      - '**/BatteryDrawable.kt'
      - '**/OverlayPainter.kt'
      - '**/ImageComposer.kt'
      - '**/ThermalView.kt'
      - '**/Palettes.kt'
      # The developer self-test: reference sizes and expected values are written out on purpose.
      - '**/SelfTest*.kt'
    ignoreNamedArgument: true
    ignoreExtensionFunctions: true
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true

naming:
  FunctionNaming:
    excludes: ['**/test/**', '**/androidTest/**']
